# ── Mosquitto Configuration (Local Dev) ──────
# Place this at /usr/local/etc/mosquitto/mosquitto.conf (macOS)
# or /etc/mosquitto/mosquitto.conf (Linux)

# ── Listener ─────────────────────────────────
listener 1883
protocol mqtt

# ── Authentication (disable for local dev) ───
allow_anonymous true

# ── Logging ──────────────────────────────────
log_type all
log_dest stdout

# ── Persistence ──────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── WebSocket support (optional) ─────────────
listener 9001
protocol websockets
