
services:
  # ── FastAPI Application ────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raksha-api
    ports:
      - "8000:8000"
      - "5005:5005/udp" # UDP Broadcast Port
    env_file:
      - .env
    environment:
      - APP_ENV=production
    restart: unless-stopped
    volumes:
      - ./app:/code/app  # Hot reload in dev
